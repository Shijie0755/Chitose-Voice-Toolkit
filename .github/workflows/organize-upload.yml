name: Organize browser upload

on:
  push:
    branches: [main]
    paths:
      - "upload_staging/**"

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move files into the repository tree
        shell: bash
        run: |
          set -euo pipefail
          declare -A targets=(
            [models__README.md]="models/README.md"
            [pipeline__build_lycoris_chisato_batch.py]="pipeline/build_lycoris_chisato_batch.py"
            [pipeline__lycoris_dataset_core.py]="pipeline/lycoris_dataset_core.py"
            [pipeline__parse_lycoris_episodes.py]="pipeline/parse_lycoris_episodes.py"
            [pipeline__prepare_selected_and_denoise.py]="pipeline/prepare_selected_and_denoise.py"
            [pipeline__rank_chisato_candidates.py]="pipeline/rank_chisato_candidates.py"
            [pipeline__validate_lycoris_chisato_stage_a.py]="pipeline/validate_lycoris_chisato_stage_a.py"
            [pipeline__configs__chisato_selections_ep03_ep13.json]="pipeline/configs/chisato_selections_ep03_ep13.json"
            [tools__folder_drop_router__README.md]="tools/folder_drop_router/README.md"
            [tools__folder_drop_router__folder_drop_router.pyw]="tools/folder_drop_router/folder_drop_router.pyw"
            [tools__voice_generator__README.md]="tools/voice_generator/README.md"
            [tools__voice_generator__chitose_webui.py]="tools/voice_generator/chitose_webui.py"
            [tools__voice_generator__start_chitose_webui.bat]="tools/voice_generator/start_chitose_webui.bat"
            [training__build_chitose_training_configs.py]="training/build_chitose_training_configs.py"
            [training__chitose_v0.1.0_inference.example.yaml]="training/chitose_v0.1.0_inference.example.yaml"
            [training__test_chitose_inference.py]="training/test_chitose_inference.py"
          )
          for source in "${!targets[@]}"; do
            target="${targets[$source]}"
            mkdir -p "$(dirname "$target")"
            mv "upload_staging/$source" "$target"
          done
          rmdir upload_staging
          rm -f .github/workflows/organize-upload.yml
      - name: Commit the organized project tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add toolkit source files"
          git push
